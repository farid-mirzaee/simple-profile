<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <section>
        <div class="profile">
            <div class="img">
                <img src="/img/IMG_8134.JPG" alt="" width="130px">
            </div>
        </div>

        <div class="info">
            <h1>M.Farid Mirzaee</h1>
            <p>Youtuber & Blogger</p>
            <div class="icons-socail">
                <span class="Youtube"><i class="fa fa-youtube-play" aria-hidden="true"></i></span>
                <span class="facebook"><i class="fa fa-facebook" aria-hidden="true"></i></span>
                <span class="twitter"><i class="fa fa-twitter" aria-hidden="true"></i></span>
                <span class="instagram"><i class="fa fa-instagram" aria-hidden="true"></i></span>
            </div>
            <div class="sub-me">
                <button>Subscribe</button>
                <button>Message</button>
            </div>
            <div class="actions">
                <span>
                <i class="fa fa-heart-o" aria-hidden="true"></i>
                    50k
                </span>
                <p>|</p>
                <span>
                <i class="fa fa-comment-o" aria-hidden="true"></i>
                    20k
                </span>
                <p>|</p>
                <span>
                <i class="fa fa-share" aria-hidden="true"></i>
                    10k
                </span>
            </div>
        </div>
    </section>
</body>
</html>
